openapi: 3.0.3

info:
  title: Orders API
  version: 1.0.0
  description: >
    Example REST API deployed behind Kong Gateway for the
    Kong Kubernetes engineering lab.

servers:
  - url: http://localhost:8000
    description: Local Kong Gateway

tags:
  - name: Orders
  - name: Health

paths:
  /orders:
    get:
      tags:
        - Orders
      summary: List orders
      operationId: listOrders

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Orders returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"

        "401":
          description: Authentication required

        "403":
          description: Client is not authorized

        "429":
          description: Rate limit exceeded

        "500":
          description: Internal server error

        "502":
          description: Upstream communication failure

        "503":
          description: Service unavailable

  /health:
    get:
      tags:
        - Health
      summary: Liveness endpoint
      operationId: healthCheck

      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      tags:
        - Health
      summary: Readiness endpoint
      operationId: readinessCheck

      responses:
        "200":
          description: Application is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Order:
      type: object
      required:
        - id
        - product
        - quantity
        - price

      properties:
        id:
          type: string
          example: ORD-1001

        product:
          type: string
          example: Kong Gateway

        quantity:
          type: integer
          minimum: 1
          example: 1

        price:
          type: number
          format: double
          minimum: 0
          example: 99.99

    OrdersResponse:
      type: object
      required:
        - status
        - data

      properties:
        status:
          type: string
          example: success

        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
