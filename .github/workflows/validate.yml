name: Validate Kong Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Kubernetes Terraform
        run: |
          terraform -chdir=terraform/kubernetes init -backend=false
          terraform -chdir=terraform/kubernetes fmt -check
          terraform -chdir=terraform/kubernetes validate

      - name: Validate AWS EKS Terraform
        run: |
          terraform -chdir=terraform/aws-eks init -backend=false
          terraform -chdir=terraform/aws-eks fmt -check
          terraform -chdir=terraform/aws-eks validate


  kubernetes:
    name: Validate Kubernetes YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML files
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml

          directories = [
              "kubernetes",
              "kong",
          ]

          checked = 0

          for directory in directories:
              root = pathlib.Path(directory)

              if not root.exists():
                  continue

              for path in root.rglob("*.yaml"):
                  print(f"Validating {path}")

                  with path.open(encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))

                  checked += 1

          print(f"Validated {checked} YAML files")
          PY


  custom-kong-plugin:
    name: Validate Custom Kong Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add Kong Helm repository
        run: |
          helm repo add kong https://charts.konghq.com
          helm repo update

      - name: Validate custom Kong plugin
        run: |
          chmod +x scripts/validate-custom-plugin.sh
          ./scripts/validate-custom-plugin.sh


  deck:
    name: Validate decK Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install decK
        run: |
          DECK_VERSION=$(curl -fsSL \
            https://api.github.com/repos/Kong/deck/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')

          echo "Installing decK ${DECK_VERSION}"

          INSTALL_DIR="$(mktemp -d)"

          curl -fsSL \
            "https://github.com/Kong/deck/releases/download/v${DECK_VERSION}/deck_${DECK_VERSION}_linux_amd64.tar.gz" \
            -o "${INSTALL_DIR}/deck.tar.gz"

          tar -xzf "${INSTALL_DIR}/deck.tar.gz" \
            -C "${INSTALL_DIR}"

          sudo install \
            -m 0755 \
            "${INSTALL_DIR}/deck" \
            /usr/local/bin/deck

          deck version

      - name: Validate Kong declarative configuration
        run: |
          deck file validate deck/kong.yaml
