apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong

spec:
  replicas: 3

  selector:
    matchLabels:
      app: kong

  template:
    metadata:
      labels:
        app: kong

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kong

      containers:
        - name: kong
          image: kong:3.9

          env:
            - name: KONG_DATABASE
              value: "off"

            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"

            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"

          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP

            - name: proxy-tls
              containerPort: 8443
              protocol: TCP

            - name: status
              containerPort: 8100
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /status/ready
              port: status
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
